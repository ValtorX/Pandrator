name: Install Windows FFmpeg
description: Install the FFmpeg build the Windows installer pins, as web-preview.yml does.

runs:
  using: composite
  steps:
    # Upstream's script checks the pinned SHA-256 and that ffprobe is present,
    # and adds the bin directory to the job's PATH. Chocolatey's newest build
    # (9.1) hung a Windows lane, so it is no longer used.
    - shell: pwsh
      run: python scripts/ci_install_windows_ffmpeg.py
