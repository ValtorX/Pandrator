name: Install Windows FFmpeg
description: Install FFmpeg with Chocolatey and fail if ffprobe is still missing.

runs:
  using: composite
  steps:
    # Chocolatey can report success having installed nothing, so check the result.
    - shell: pwsh
      run: |
        foreach ($attempt in 1..3) {
          if ($attempt -gt 1) { Start-Sleep -Seconds (30 * ($attempt - 1)) }
          choco install ffmpeg --yes --no-progress
          if (Get-Command ffprobe -ErrorAction SilentlyContinue) { exit 0 }
        }
        throw 'FFmpeg did not install: no ffprobe on PATH.'
