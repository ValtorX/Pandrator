# Owner rules for this fork (2026-11-09). Sparse override: only these facts.
[workflow]

persistent_facts = [
  "Owner rule: never write to deferred-work.md. Handle every finding and split-off goal inside the current story by default. Only when a planned story already owns the work, name that story in the plan's triage log instead (for example: 'stays with story 10, which owns G3'). When no story owns it, raise it to the owner as a decision; in a non-interactive run, report it in the final status as needing the owner's decision. This replaces every 'defer' route in this workflow.",
  "Owner rule on subagent models: subagents other than review lenses may use Sonnet 5.5 or Haiku 5.5 with a reasoning effort that fits the task. Those are implementation handoffs, codebase exploration, test or check runs, and mechanical fixes. Review subagents stay at the session's model capability, as this workflow's steps require.",
  "Owner rule on plan approval (2026-11-11): at CHECKPOINT 1 in step 2, when nothing needs the owner (the plan has no Open Questions), do not HALT. Present the checkpoint summary as written (risk and its reason, the plan file path), then treat it as 'Approve and continue': re-read the plan from disk, set status `ready-for-dev`, and go on to step 3 in this session. If any question was raised, HALT at the checkpoint as written. This lifts 'ALWAYS halt at checkpoints' for CHECKPOINT 1 only; every other checkpoint and HALT still applies.",
  "Owner rule on plan size (2026-11-11): a plan's length is never a reason to split it or to ask. Skip step 2's token-count gate entirely: do not show the count, do not offer Split, and keep the full plan. A story that grows past 1600 tokens stays whole, so it is really done when it is done.",
]
