# Owner rules for this fork (2026-11-09). Sparse override: only these facts.
[workflow]

persistent_facts = [
  "Owner rule: never write to deferred-work.md. Handle every finding and split-off goal inside the current story by default. Only when a planned story already owns the work, name that story in the plan's triage log instead (for example: 'stays with story 10, which owns G3'). When no story owns it, raise it to the owner as a decision; in a non-interactive run, report it in the final status as needing the owner's decision. This replaces every 'defer' route in this workflow.",
  "Owner rule on subagent models: subagents other than review lenses may use Sonnet 5.5 or Haiku 5.5 with a reasoning effort that fits the task. Those are implementation handoffs, codebase exploration, test or check runs, and mechanical fixes. Review subagents stay at the session's model capability, as this workflow's steps require.",
  "Owner rule on story size (2026-11-11): how large the story or its diff has grown is never a reason to leave a finding for later. Fix every finding that belongs to this story inside it, whatever that does to its size. Size never turns a finding into defer or into a decision for the owner.",
  "Owner rule on running without stops (2026-11-11): when nothing needs the owner, keep going. (a) Step 1, instruction 7: review the whole diff whatever its size; never offer to chunk it. (b) Step 1 CHECKPOINT: present the summary, then go on to step 2 without waiting. (c) Step 5: once no decision_needed finding is open (none were found, or the owner has answered them all), skip the patch menu and take 'Apply every patch': apply them all, summarize, and check them off in the plan. Every question still stands: an unclear review target, the plan-file question, decision_needed findings, and the closing next-steps menu.",
]
